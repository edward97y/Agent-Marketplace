name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
     quality-check:
      name: Code Quality & Tests
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
  
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"
  
        - name: Install uv
          uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
  
        - name: Install dependencies
          run: make install
  
        - name: Run lint and tests
          run: make check