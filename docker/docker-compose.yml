services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: MarketPlace_postgres_db
    ports:
      - "1234:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_DB=${POSTGRES_Market_DATABASE}
    volumes:
      - postgresdata:/var/lib/postgresql
    networks:
      - backend
    restart: always
networks:
    backend:
      driver: bridge
volumes:
     postgresdata: